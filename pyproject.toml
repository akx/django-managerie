[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-managerie"
dynamic = ["version"]
description = "Expose Django management commands in the admin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aarni Koskela", email = "akx@iki.fi" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "Django>=5.2",
]

[dependency-groups]
dev = [
    "pytest-django>=4.10",
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/akx/django-managerie"

[tool.hatch.version]
path = "django_managerie/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/django_managerie",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "managerie_test_app.settings"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "COM",
    "C9",
    "E",
    "F",
    "I",
    "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.tox]
requires = ["tox>=4.22"]
env_list = [
    "py311-django52",
    "py312-django52",
    "py312-django60",
    "py312-django61",
    "py313-django52",
    "py313-django60",
    "py313-django61",
    "py314-django52",
    "py314-django60",
    "py314-django61",
    "py315-django61",
]

[tool.tox.env_run_base]
runner = "uv-venv-runner"
dependency_groups = ["dev"]
deps = [
    { replace = "if", extend = true, condition = "factor.django52", then = ["Django~=5.2.0"] },
    { replace = "if", extend = true, condition = "factor.django60", then = ["Django~=6.0.0"] },
    { replace = "if", extend = true, condition = "factor.django61", then = ["Django~=6.1.0"] },
]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314"]
"3.15" = ["py315"]
